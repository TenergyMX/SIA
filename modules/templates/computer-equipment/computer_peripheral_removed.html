{% extends 'ynex/base.html' %}
{% block content %}
<div class="d-md-flex d-block align-items-center justify-content-between my-4 page-header-breadcrumb">

        Equipos de cómputo
    </h1>
    <div class="ms-md-1 ms-0">
        <nav>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">Equipo de Cómputo</li>
                <li class="breadcrumb-item active" aria-current="page">
                    Eliminados

            </ol>
        </nav>
    </div>
</div>

<section class="w-100">

            </div>

                    title="Refrescar tabla" data-refresh-table="table_">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
        <div class="card-body">
            <!-- tabla -->
            <div class="table-responsive">
                <table class="table table-bordered w-100" id="computers_peripheral_removed">
                    <thead></thead>
                    <tbody></tbody>
                    <tfoot></tfoot>

            <!-- end tabla -->
        </div>
    </div>
</section>

{% endblock %}
