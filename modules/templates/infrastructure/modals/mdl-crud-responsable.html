<div class="modal fade effect-scale" id="mdl-crud-responsable" tabindex="-1"
    aria-labelledby="modalAsignarResponsableLabel" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-fullscreen-lg-down modal-dialog-scrollable">
        <form id="formAsignarResponsable">
            {% csrf_token %}

            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalAsignarResponsableLabel">
                        Asignar responsable
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="detalle_id">

                    <!-- Tipo de asignación -->
                    <div class="mb-3">
                        <label for="tipo_responsable" class="form-label">
                            Tipo de asignación
                        </label>

                        <select id="tipo_responsable" class="form-select" required>
                            <option value="" disabled selected>
                                Seleccione una opción
                            </option>
                            <option value="usuario">Usuario específico</option>
                            <option value="area">Área</option>
                            <option value="activo_comunitario">Activo comunitario</option>
                        </select>
                    </div>

                    <!-- Usuario específico -->
                    <div class="mb-3 d-none" id="container_usuario">
                        <label for="responsable" class="form-label">
                            Seleccionar usuario
                        </label>

                        <select id="responsable" class="form-select">
                            <option value="" disabled selected>
                                Seleccione un usuario
                            </option>
                        </select>
                    </div>

                    <!-- Área -->
                    <div class="mb-3 d-none" id="container_area">
                        <label for="area_responsable" class="form-label">
                            Seleccionar área
                        </label>

                        <select id="area_responsable" class="form-select">
                            <option value="" disabled selected>
                                Seleccione un área
                            </option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">
                        Guardar
                    </button>

                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>
