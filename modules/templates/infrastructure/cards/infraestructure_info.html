<div class="card custom-card card-audit-info">
    <div class="card-body">

        <div class="row g-2">

            <div class="col-md-5">
                <span class="fw-bolder">ID de Auditoría:</span>
            </div>
            <div class="col-md-7">
                <span>{{ audit.id }}</span>
            </div>

            <div class="col-md-5">
                <span class="fw-bolder">Nombre:</span>
            </div>
            <div class="col-md-7">
                <span>{{ audit.name }}</span>
            </div>

            <div class="col-md-5">
                <span class="fw-bolder">Responsable:</span>
            </div>
            <div class="col-md-7">
                <span>{{ audit.responsible|default:"Sin responsable" }}</span>
            </div>

        </div>

    </div>
</div>
